# Structure-predictor compatibility checks.
name: Structure backend adapters

on: [push, pull_request]

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_alphafold3_backend.py -q
      - run: python tests/test_structure_engine_selection_and_boltz_job.py
      - run: python tests/test_adaptive_cb_selection_to_structure_prediction.py
      - run: python tests/test_mcp_tools.py
      - run: bash -n scripts/run_switchtune.sh
