# Python package metadata and dependencies.
[project]
name = "switchtune"
version = "0.3.0"
description = "Natural-language-driven, state-aware mutation design for conformational-switching proteins"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "pyyaml>=6.0",
  "biopython>=1.83",
  "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["switchtune*"]
